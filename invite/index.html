<!DOCTYPE html>
<!--
  Penny Football: the personal invite page (task 10f, D92). Published on the website (repo nsare-website) as
  /invite/index.html, so nsaresmartsolutions.com/invite/?c=CODE opens it. Shows the friend's code big, copies it as
  "PF-CODE" (the iPhone app offers it after sign-up), and links the stores; Google Play's link carries
  referrer=pfcode=CODE, which the Android app reads on its first launch. Self-contained: no outside files.
  The numbers here must match finger-football src/config/config.ts (CONFIG.referral; tests/web/invitePage.test.ts).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c150e">
<title>Penny Football: Invite</title>
<meta property="og:title" content="Penny Football">
<meta property="og:description" content="A friend invited you to Penny Football: the school-desk coin football game.">
<style>
  :root {
    --wood: #1c150e;
    --frame: #6b4423;
    --board: #24382c;
    --chalk: #f2efe6;
    --muted: #b9c2b4;
    --yellow: #ffd678;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--wood);
    color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .board {
    width: 100%;
    max-width: 420px;
    background: var(--board);
    border: 10px solid var(--frame);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(0, 0, 0, 0.35);
    padding: 24px 20px 20px;
    text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  .lead { margin: 0 0 18px; color: var(--muted); }
  .label { font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; }
  .code {
    font-family: 'Courier New', ui-monospace, monospace;
    font-weight: 700;
    font-size: 2.6rem;
    letter-spacing: 0.18em;
    color: var(--yellow);
    margin: 0 0 12px;
    user-select: all;
    word-break: break-all;
  }
  button, .store {
    display: block;
    width: 100%;
    margin: 10px 0 0;
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid var(--chalk);
    background: transparent;
    color: var(--chalk);
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    cursor: pointer;
  }
  .primary { background: var(--yellow); border-color: var(--yellow); color: var(--wood); }
  .copied { min-height: 1.5em; margin-top: 6px; color: var(--yellow); font-size: 0.95rem; }
  ol { text-align: left; margin: 18px 0 0; padding-left: 1.3em; color: var(--muted); font-size: 0.95rem; }
  li { margin: 4px 0; }
  .bad { color: var(--yellow); margin: 0 0 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="board">
  <h1 id="title">Penny Football</h1>
  <p class="lead" id="lead"></p>
  <div id="has-code">
    <div class="label" id="code-label"></div>
    <div class="code" id="code"></div>
    <button type="button" class="primary" id="copy"></button>
    <div class="copied" id="copied" aria-live="polite"></div>
  </div>
  <p class="bad" id="no-code" hidden></p>
  <a class="store" id="app-store" href="#"></a>
  <a class="store" id="google-play" href="#"></a>
  <ol id="steps"></ol>
</main>
<script>
(function () {
  // Must match CONFIG.referral in finger-football (tests/web/invitePage.test.ts checks).
  var CODE_LENGTH = 6;
  var ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var CLIP_PREFIX = 'PF-';
  var REFERRER_KEY = 'pfcode';
  var APP_STORE = 'https://apps.apple.com/app/id6820253275';
  var GOOGLE_PLAY = 'https://play.google.com/store/apps/details?id=com.nsaresmartsolutions.pennyfootball';

  var TEXT = {
    tr: {
      title: 'Para Futbolu',
      lead: 'Bir arkadaşın seni Para Futbolu\'na davet etti!',
      codeLabel: 'Davet kodu',
      copy: 'Kodu kopyala',
      copied: 'Kopyalandı!',
      copyFailed: 'Kopyalanamadı. Kodu not al.',
      noCode: 'Bu linkte davet kodu yok. Oyunu yine de indirebilirsin.',
      appStore: 'App Store\'dan indir',
      googlePlay: 'Google Play\'den indir',
      steps: [
        'Kodu kopyala (App Store düğmesi de kopyalar).',
        'Oyunu indir, aç ve kayıt ol.',
        'Oyun kodu kendisi bulup sorar. Sormazsa: Mağaza → Arkadaşını davet et → kodu yapıştır.',
        '3 maç bitirince ikiniz de 500 puan alırsınız.'
      ]
    },
    en: {
      title: 'Penny Football',
      lead: 'A friend invited you to Penny Football!',
      codeLabel: 'Invite code',
      copy: 'Copy the code',
      copied: 'Copied!',
      copyFailed: 'Couldn\'t copy. Write the code down.',
      noCode: 'This link has no invite code. You can still get the game.',
      appStore: 'Get it on the App Store',
      googlePlay: 'Get it on Google Play',
      steps: [
        'Copy the code (the App Store button copies it too).',
        'Get the game, open it and sign up.',
        'The game finds the code and asks. If it doesn\'t: Shop → Invite a friend → paste the code.',
        'Finish 3 matches and you both get 500 points.'
      ]
    }
  };

  var lang = /^tr\b/i.test(navigator.language || '') ? 'tr' : 'en';
  var tx = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = tx.title;

  // "ABC234", "abc-234" or "PF-ABC234" all read as ABC234.
  function tidy(raw) {
    return String(raw || '').trim().replace(/^PF-/i, '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, CODE_LENGTH);
  }
  function ok(code) {
    if (code.length !== CODE_LENGTH) return false;
    for (var i = 0; i < code.length; i++) if (ALPHABET.indexOf(code.charAt(i)) < 0) return false;
    return true;
  }
  var raw = '';
  try { raw = new URLSearchParams(location.search).get('c') || ''; } catch (e) { raw = ''; }
  var code = tidy(raw);
  if (!ok(code)) code = '';

  var $ = function (id) { return document.getElementById(id); };
  $('title').textContent = tx.title;
  $('lead').textContent = tx.lead;
  $('code-label').textContent = tx.codeLabel;
  $('copy').textContent = tx.copy;
  $('app-store').textContent = tx.appStore;
  $('google-play').textContent = tx.googlePlay;
  tx.steps.forEach(function (s) {
    var li = document.createElement('li');
    li.textContent = s;
    $('steps').appendChild(li);
  });

  if (code) {
    $('code').textContent = code;
  } else {
    $('has-code').hidden = true;
    $('no-code').hidden = false;
    $('no-code').textContent = tx.noCode;
    $('steps').hidden = true;
  }

  function copyCode() {
    var text = CLIP_PREFIX + code;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return oldCopy(text); });
    }
    return Promise.resolve(oldCopy(text));
  }
  function oldCopy(text) {
    try {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, text.length);
      var done = document.execCommand('copy');
      document.body.removeChild(area);
      return done;
    } catch (e) {
      return false;
    }
  }

  $('copy').addEventListener('click', function () {
    copyCode().then(function (done) {
      $('copied').textContent = done ? tx.copied : tx.copyFailed;
    });
  });

  var play = GOOGLE_PLAY + (code ? '&referrer=' + encodeURIComponent(REFERRER_KEY + '=' + code) : '');
  $('google-play').href = play;
  $('app-store').href = APP_STORE;
  // The App Store does not carry the code: copy it on the way, the app offers it after sign-up.
  $('app-store').addEventListener('click', function (e) {
    if (!code) return;
    e.preventDefault();
    var go = function () { location.href = APP_STORE; };
    copyCode().then(go, go);
  });

  // The phone's own store first and big; the other one stays (a friend may be on a computer).
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  // With a code, "Copy" is the yellow button; without one, the store is.
  if (ios) {
    if (!code) $('app-store').classList.add('primary');
    $('google-play').hidden = true;
  } else if (android) {
    if (!code) $('google-play').classList.add('primary');
    $('app-store').hidden = true;
  }
})();
</script>
</body>
</html>
